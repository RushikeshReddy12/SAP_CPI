name: Sync IFlows from CPI to GitHub

on:
  workflow_dispatch:
    inputs:
      packageId:
        description: 'CPI Integration Package ID'
        required: true
        type: string

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: pip install requests

      - name: Export iFlows from CPI
        env:
          CPI_USER: ${{ secrets.DEV_USER_ID }}
          CPI_PASSWORD: ${{ secrets.DEV_PASSWORD }}
          CPI_HOST: '454bb488trial.integrationsuite-trial01.cfapps.us10-001.hana.ondemand.com'
          PACKAGE_ID: ${{ github.event.inputs.packageId }}
        run: python export-iflows.py

      - name: Configure Git
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"

      - name: Commit and Push to GitHub
        run: |
          git add -A
          git diff --staged --quiet || git commit -m "Sync iFlows from CPI: ${{ github.event.inputs.packageId }} [skip ci]"
          git push
