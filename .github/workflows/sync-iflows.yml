name: Sync IFlows from CPI to GitHub

on:
  workflow_dispatch:
    inputs:
      packageId:
        description: 'CPI Integration Package ID'
        required: true
        type: string

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install FlashPipe CLI
        run: npm install -g @flashpipe/cli

      - name: Sync from Tenant to GitHub
        run: |
          flashpipe sync \
            --tenant-host "${{ secrets.TMN_HOST }}" \
            --oauth-host "${{ secrets.OAUTH_HOST }}" \
            --user "${{ secrets.DEV_USER_ID }}" \
            --password "${{ secrets.DEV_PASSWORD }}" \
            --package-id "${{ github.event.inputs.packageId }}" \
            --dir-artifacts-relative "packages/${{ github.event.inputs.packageId }}" \
            --git-token "${{ secrets.GITHUB_TOKEN }}"
