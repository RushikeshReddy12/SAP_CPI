name: Sync iFlows to GitHub

on:
  workflow_dispatch:
    inputs:
      package_id:
        description: 'Integration Package ID'
        required: true
  schedule:
    - cron: '0 2 * * *'  # nightly sync

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Sync iFlows
        uses: engswee/flashpipe-action@latest
        with:
          tmn-host: ${{ secrets.CPI_HOST }}
          oauth-host: ${{ secrets.OAUTH_HOST }}
          oauth-clientid: ${{ secrets.OAUTH_CLIENT_ID }}
          oauth-clientsecret: ${{ secrets.OAUTH_CLIENT_SECRET }}
          package-id: ${{ github.event.inputs.package_id }}
          git-src-dir: iflows/
