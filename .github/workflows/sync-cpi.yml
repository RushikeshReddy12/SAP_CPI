name: Sync iFlows to GitHub

on:
  workflow_dispatch:
    inputs:
      packageId:
        description: 'SAP CPI Package ID'
        required: true

jobs:
  sync_iflows:
    runs-on: ubuntu-latest
    container:
      image: engswee/flashpipe:latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync iFlow from CPI to Git
        uses: engswee/flashpipe-action/sync@v1
        with:
          tmn-host: ${{ secrets.TMN_HOST }}
          oauth-host: ${{ secrets.OAUTH_HOST }}
          oauth-clientid: ${{ secrets.CLIENT_ID }}
          oauth-clientsecret: ${{ secrets.CLIENT_SECRET }}
          package-id: ${{ github.event.inputs.packageId }}

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --quiet && git diff --staged --quiet || git commit -m "Sync iFlow: ${{ github.event.inputs.packageId }}"
          git push
