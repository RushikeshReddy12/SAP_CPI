name: Snapshot SAP Integration Suite to GitHub

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'  # optional nightly sync

jobs:
  snapshot:
    runs-on: ubuntu-latest
    container:
      image: engswee/flashpipe:latest   # ← THIS was missing — action requires it

    steps:
      - uses: actions/checkout@v3

      - name: Snapshot all iFlows to GitHub
        uses: engswee/flashpipe-action/snapshot@v1
        with:
          tmn-host: ${{ vars.TMN_HOST }}
          oauth-host: ${{ vars.OAUTH_HOST }}
          oauth-clientid: ${{ secrets.DEV_CLIENT_ID }}
          oauth-clientsecret: ${{ secrets.DEV_CLIENT_SECRET }}
          # ids-include: "PackageA,PackageB"  # optional: limit to specific packages
          # ids-exclude: "PackageX"           # optional: exclude specific packages
